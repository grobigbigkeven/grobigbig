  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"836ad8cc-e70b-47e8-8864-5df31706f90a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Gro Big Big Design System — global entry point.\n   Consumers link THIS file only. Keep it a list of @imports. */\n\n/* Gro Big Big — Webfonts\n   The house speaks in one typeface: Plus Jakarta Sans (variable, shipped locally).\n   Operating sub-brands (AccPro, grof) keep their own faces in their own\n   products; the house system ships only Plus Jakarta Sans. */\n\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  src: url(\"6a1cea6c-7e63-4342-9008-863240cf1133\") format('truetype-variations'),\n       url(\"6a1cea6c-7e63-4342-9008-863240cf1133\") format('truetype');\n  font-weight: 200 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  src: url(\"744a3cdb-86b3-444f-b5a9-dd7491c34e75\") format('truetype-variations'),\n       url(\"744a3cdb-86b3-444f-b5a9-dd7491c34e75\") format('truetype');\n  font-weight: 200 800;\n  font-style: italic;\n  font-display: swap;\n}\n\n/* Gro Big Big — Colour\n   The house sits between its two operating brands. Pine green lands halfway\n   between AccPro's forest and grof's navy; amber lands halfway between\n   AccPro's gold and grof's orange. The result reads as the calm middle. */\n\n:root {\n  /* ---- House primary ---- */\n  --gbb-pine: #173E3D;        /* primary brand green */\n  --gbb-pine-deep: #102E2D;   /* darkest pine — footers, deep panels */\n  --gbb-pine-700: #1C4A48;    /* hover/raised pine */\n  --gbb-amber: #E0913A;       /* accent — eyebrows, the peak, highlights */\n  --gbb-amber-soft: #F0C088;  /* amber tint — backgrounds, fills */\n\n  /* ---- Ink & neutrals (warm-cool grey, very low chroma) ---- */\n  --gbb-ink: #1C2128;         /* primary text on light */\n  --gbb-muted: #5E6B6A;       /* secondary text */\n  --gbb-faint: #A7AAAD;       /* tertiary text, captions, hex labels */\n  --gbb-border: #D9DDD8;      /* hairlines, card borders */\n  --gbb-canvas: #F5F4F0;      /* warm paper background */\n  --gbb-surface: #FFFFFF;     /* cards, raised surfaces */\n\n  /* ---- Functional alpha (on light) ---- */\n  --gbb-amber-12: rgba(224,145,58,0.12);\n  --gbb-amber-28: rgba(224,145,58,0.28);\n  --gbb-pine-09: rgba(23,62,61,0.09);\n\n  /* ---- Operating-brand colours (for sub-brand contexts only) ---- */\n  --accpro-forest: #245B4A;\n  --accpro-gold: #C6A15B;\n  --grof-navy: #13213D;\n  --grof-orange: #FB800C;\n  --grof-orange-deep: #C2570A;\n  --grof-blue-soft: #BFE0F5;\n\n  /* ---- Semantic aliases ---- */\n  --color-bg: var(--gbb-canvas);\n  --color-surface: var(--gbb-surface);\n  --color-text: var(--gbb-ink);\n  --color-text-muted: var(--gbb-muted);\n  --color-text-faint: var(--gbb-faint);\n  --color-heading: var(--gbb-pine);\n  --color-accent: var(--gbb-amber);\n  --color-border: var(--gbb-border);\n  --color-brand: var(--gbb-pine);\n  --color-on-brand: #FFFFFF;\n  --color-selection: var(--gbb-amber-28);\n}\n\n/* Gro Big Big — Typography\n   The house speaks in one geometric sans: Plus Jakarta Sans.\n   Tight display tracking, generous body leading (1.65). Eyebrows are the only\n   uppercase element. Operating brands keep their own faces in their own contexts. */\n\n:root {\n  /* ---- Families ---- */\n  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-house: var(--font-sans);\n\n  /* ---- Weights ---- */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium: 500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n\n  /* ---- Type scale (px) ---- */\n  --fs-display: 88px;   /* hero only */\n  --fs-h1: 46px;\n  --fs-h2: 42px;\n  --fs-h3: 30px;\n  --fs-h4: 22px;\n  --fs-lead: 20px;      /* intro paragraphs */\n  --fs-body: 16px;\n  --fs-sm: 15px;\n  --fs-caption: 13px;\n  --fs-eyebrow: 11px;\n\n  /* ---- Line heights ---- */\n  --lh-display: 0.98; /* @kind font */\n  --lh-heading: 1.08; /* @kind font */\n  --lh-body: 1.65; /* @kind font */\n  --lh-tight: 1.2; /* @kind font */\n\n  /* ---- Letter spacing ---- */\n  --ls-display: -2.6px;\n  --ls-h1: -1.2px;\n  --ls-h2: -1px;\n  --ls-h3: -0.6px;\n  --ls-body: 0; /* @kind font */\n  --ls-eyebrow: 1.4px;  /* uppercase eyebrow only */\n}\n\n/* Gro Big Big — Spacing, radius & layout\n   8px base rhythm. Sections breathe at 104px. Container caps at 1080px. */\n\n:root {\n  /* ---- Spacing scale ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 80px;\n  --space-10: 104px;\n\n  /* ---- Layout ---- */\n  --container-max: 1080px;\n  --container-pad: 48px;\n  --section-y: 104px;\n\n  /* ---- Radius ---- */\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 14px;\n  --radius-pill: 9999px;\n\n  /* ---- Borders ---- */\n  --border-hairline: 1px solid var(--gbb-border);\n}\n\n/* Gro Big Big — Effects: shadow, motion, focus\n   Shadows are tinted pine, never neutral grey — they keep the warmth.\n   Motion is calm: short, eased, no bounce. */\n\n:root {\n  /* ---- Shadows (pine-tinted) ---- */\n  --shadow-sm: 0 1px 3px rgba(23,62,61,0.08);\n  --shadow-md: 0 8px 28px rgba(23,62,61,0.16);\n  --shadow-lg: 0 18px 48px rgba(16,46,45,0.22);\n\n  /* ---- Motion ---- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n\n  /* ---- Focus ring ---- */\n  --focus-ring: 0 0 0 3px var(--gbb-amber-28);\n}\n\n<\u002Fstyle>\n<script src=\"3ac7148c-4c9b-44d6-b90c-7d59aafa017f\"><\u002Fscript>\n<script src=\"de53c899-367f-4255-8d54-a3969eed726b\"><\u002Fscript>\n<style>\n  html, body { margin: 0; position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center;\">\n      <div style=\"flex: none; white-space: nowrap; margin-bottom: 0;\">\n        <x-import component-from-global-scope=\"GroBigBigDesignSystem_ee6236.BrandMark\" size=\"{{ 76 }}\" reversed=\"{{ true }}\" with-wordmark=\"{{ true }}\" hint-size=\"420px,80px\"><\u002Fx-import>\n      <\u002Fdiv>\n      <h1 style=\"margin: clamp(8px, 1.4vh, 18px) 0 0; font-size: clamp(40px, 6.2vw, 116px); font-weight: 700; line-height: 1; letter-spacing: -4.5px; white-space: nowrap;\">Built to Grow Big.<\u002Fh1>\n      <p style=\"margin: clamp(10px, 1.6vh, 18px) 0 0; font-size: clamp(14px, 1.95vw, 26px); line-height: 1.62; white-space: nowrap; color: rgba(255,255,255,0.8);\">We are a permanent buy-and build platform for professional services in&nbsp;<span data-cc-id=\"cc-3\" style=\"color: var(--gbb-amber);\">Asia<\u002Fspan>.<\u002Fp>\n      <div style=\"margin-top: clamp(14px, 2vh, 24px); display: flex; gap: 14px; flex-wrap: wrap;\">\n        <a href=\"#talk\" style=\"display: inline-flex; align-items: center; height: 62px; flex: none; white-space: nowrap; padding: 0 34px; border-radius: var(--radius-sm); background: var(--gbb-amber); color: var(--gbb-pine-deep); font-size: 26px; font-weight: 700;\" style-hover=\"background: var(--gbb-amber-soft);\">Start a conversation<\u002Fa>\n        <a href=\"#deal\" style=\"display: inline-flex; align-items: center; height: 62px; flex: none; white-space: nowrap; box-sizing: border-box; padding: 0 32px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.28); color: #fff; font-size: 26px; font-weight: 600;\" style-hover=\"border-color: var(--gbb-amber); color: var(--gbb-amber);\">See how a deal works →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: relative; margin-top: auto; flex: none; display: flex; align-items: stretch; background: var(--gbb-pine-deep); border-top: 1px solid rgba(255,255 );\"><\u002Fdiv>\n            <div style=\"width: 100%; box-sizing: border-box; min-height: 62px; background: #fff; border: 1px dashed var(--gbb-amber); border-radius: var(--radius-sm); padding: 14px 18px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; font-weight: 600; color: var(--gbb-pine);\">Your practice<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--gbb-border); display: flex; flex-direction: column; gap: 10px; font-size: 22px; line-height: 1.5; color: var(--gbb-ink);\">\n            <span>· You stay in the driver's seat of your own unit<\u002Fspan>\n            <span>· Fixed-term put &amp; call — the exit price mechanism is agreed up front<\u002Fspan>\n            <span>· Strongest incentive where you have the most control<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;\">\n        <div style=\"padding: 20px 0; border-top: 2px solid var(--gbb-pine);\">\n          <div style=\"font-size: 22px; font-weight: 700; color: var(--gbb-pine);\">Autonomy, within a charter<\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 22px; line-height: 1.55; color: var(--gbb-muted);\">You keep your name over the door and your call on clients, inside an agreed annual budget.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 0; border-top: 2px solid var(--gbb-pine);\">\n          <div style=\"font-size: 22px; font-weight: 700; color: var(--gbb-pine);\">Back office, delegated<\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 22px; line-height: 1.55; color: var(--gbb-muted);\">HR, finance, admin and compliance move to the group. You go back to clients.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 0; border-top: 2px solid var(--gbb-pine);\">\n          <div style=\"font-size: 22px; font-weight: 700; color: var(--gbb-pine);\">Earn-outs, honestly set<\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 22px; line-height: 1.55; color: var(--gbb-muted);\">Targets you helped write, measured on numbers you can see in CORE.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Process\" style=\"padding: 104px 0; background: var(--gbb-pine); color: #fff; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 64px 64px;\"><\u002Fdiv>\n    <div style=\"max-width: 1080px; margin: 0 auto; padding: 0 48px; position: relative;\">\n      \n      <div style=\"display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 1fr); gap: clamp(48px, 8vw, 140px); align-items: start; margin-top: 18px;\">\n        <h2 style=\"margin: 0; font-size: 46px; font-weight: 700; line-height: 1.06; letter-spacing: -1.3px; white-space: nowrap;\">The Deal Process in 3-4 Months<\u002Fh2>\n        \n      <\u002Fdiv>\n\n      <div style=\"margin-top: 60px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: auto auto auto auto; gap: 28px;\">\n        <div style=\"display: grid; grid-row: span 4; grid-template-rows: subgrid; align-content: start;\">\n          <div style=\"display: flex; align-items: center; gap: 0;\">\n            <div style=\"width: 13px; height: 13px; border-radius: 50%; background: var(--gbb-amber); flex: none;\"><\u002Fdiv>\n            <div style=\"flex: 1; height: 2px; background: rgba(224,145,58,0.5);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 22px; font-size: 20px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gbb-amber);\">Days 1–14<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 26px; font-weight: 700; line-height: 1.2;\">Conversation, then numbers<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-size: 21px; line-height: 1.6; color: rgba(255,255,255,0.66);\">A mutual NDA, three years of financials, and an honest hour on what you want the outcome to look like.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-row: span 4; grid-template-rows: subgrid; align-content: start;\">\n          <div style=\"display: flex; align-items: center; gap: 0;\">\n            <div style=\"width: 13px; height: 13px; border-radius: 50%; background: var(--gbb-amber); flex: none;\"><\u002Fdiv>\n            <div style=\"flex: 1; height: 2px; background: rgba(224,145,58,0.5);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 22px; font-size: 20px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gbb-amber);\">Days 15–30<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 26px; font-weight: 700; line-height: 1.2;\">Indicative offer<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-size: 21px; line-height: 1.6; color: rgba(255,255,255,0.66);\">A one-page term sheet: valuation range, structure A or B, and what stays yours. Non-binding, and specific.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-row: span 4; grid-template-rows: subgrid; align-content: start;\">\n          <div style=\"display: flex; align-items: center; gap: 0;\">\n            <div style=\"width: 13px; height: 13px; border-radius: 50%; background: var(--gbb-amber); flex: none;\"><\u002Fdiv>\n            <div style=\"flex: 1; height: 2px; background: rgba(224,145,58,0.5);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 22px; font-size: 20px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gbb-amber);\">Days 31–60<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 26px; font-weight: 700; line-height: 1.2;\">Due diligence<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-size: 21px; line-height: 1.6; color: rgba(255,255,255,0.66);\">Financial, client, people and compliance review — run by our own team, not a rotating cast of advisers.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-row: span 4; grid-template-rows: subgrid; align-content: start;\">\n          <div style=\"display: flex; align-items: center; gap: 0;\">\n            <div style=\"width: 13px; height: 13px; border-radius: 50%; background: var(--gbb-amber); flex: none;\"><\u002Fdiv>\n            <div style=\"flex: 1; height: 2px; background: linear-gradient(90deg, rgba(224,145,58,0.5), transparent);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 22px; font-size: 20px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gbb-amber);\">Days 61–90<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 26px; font-weight: 700; line-height: 1.2;\">Sign and close<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-size: 21px; line-height: 1.6; color: rgba(255,255,255,0.66);\">Definitive agreement, completion, then your team and your clients hear it from you — in that order.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 48px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: var(--radius-md); padding: 26px 30px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap;\">\n        <div style=\"font-size: 20px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gbb-amber); flex: none;\">Day 91 onward<\u002Fdiv>\n        <div style=\"font-size: 23px; line-height: 1.55; color: rgba(255,255,255,0.86); flex: 1; min-width: 320px;\">Integration starts the week after close: platform migration, shared delivery hand-off, and a hundred-day plan you sign off on before anything moves.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Contact\" id=\"talk\" style=\"padding: 104px 0; background: var(--gbb-pine-deep); color: #fff; position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 64px 64px;\"><\u002Fdiv>\n    <div style=\"max-width: 1080px; margin: 0 auto; padding: 0 48px; position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start;\">\n      <div>\n        \n        <h2 style=\"margin: 18px 0 0; font-size: 48px; font-weight: 700; line-height: 1.04; letter-spacing: -1.5px;\">Start Here:<\u002Fh2>\n        <p style=\"margin: 24px 0 0; font-size: 24px; line-height: 1.66; color: rgba(255,255,255,0.72);\">Tell us the shape of your practice and we will come back within two working days with a time — and, if it looks like a fit, an indicative range before you meet anyone else.<\u002Fp>\n        <div style=\"margin-top: 40px; display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"display: flex; gap: 14px; align-items: baseline;\">\n            <span style=\"font-size: 20px; font-weight: 700; color: var(--gbb-amber); flex: none; width: 22px;\">01<\u002Fspan>\n            <span style=\"font-size: 22px; line-height: 1.55; color: rgba(255,255,255,0.8);\">You send the form. It goes to Weng Leong and Jackson.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 14px; align-items: baseline;\">\n            <span style=\"font-size: 20px; font-weight: 700; color: var(--gbb-amber); flex: none; width: 22px;\">02<\u002Fspan>\n            <span style=\"font-size: 22px; line-height: 1.55; color: rgba(255,255,255,0.8);\">We reach out for a sincere and honest conversation.<\u002Fspan>\n          <\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fff; border-radius: var(--radius-lg, 14px); padding: 36px; box-shadow: var(--shadow-lg); color: var(--gbb-ink);\">\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submit }}\" style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px;\">\n              <x-import component-from-global-scope=\"GroBigBigDesignSystem_ee6236.Input\" label=\"Your name\" name=\"name\" placeholder=\"Jane Tan\" required=\"{{ true }}\" hint-size=\"100%,76px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"GroBigBigDesignSystem_ee6236.Input\" label=\"Firm\" name=\"firm\" placeholder=\"Tan &amp; Associates\" required=\"{{ true }}\" hint-size=\"100%,76px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px;\">\n              <x-import component-from-global-scope=\"GroBigBigDesignSystem_ee6236.Input\" label=\"Work email\" name=\"email\" type=\"email\" placeholder=\"jane@firm.com\" required=\"{{ true }}\" hint-size=\"100%,76px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"GroBigBigDesignSystem_ee6236.Input\" label=\"Mobile / WhatsApp\" name=\"phone\" placeholder=\"+65 9000 0000\" hint-size=\"100%,76px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px;\">\n              <label style=\"display: block;\">\n                <span style=\"display: block; font-size: 21px; font-weight: 600; margin-bottom: 8px;\">Market<\u002Fspan>\n                <sc-raw-select name=\"market\" style=\"width: 100%; height: 46px; padding: 0 12px; font-size: 22px; font-family: inherit; color: var(--gbb-ink); background: #fff; border: 1px solid var(--gbb-border); border-radius: var(--radius-sm); box-sizing: border-box;\">\n                  <option>Singapore<\u002Foption>\n                  <option>Malaysia<\u002Foption>\n                  <option>Philippines<\u002Foption>\n                  <option>Indonesia<\u002Foption>\n                  <option>Elsewhere in Asia<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label style=\"display: block;\">\n                \n                \n              <\u002Flabel>\n            <\u002Fdiv>\n            <div>\n              <span style=\"display: block; font-size: 21px; font-weight: 600; margin-bottom: 10px;\">What interests you<\u002Fspan>\n              <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n                <label style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--gbb-border); border-radius: 999px; font-size: 22px; cursor: pointer;\">\n                  <input type=\"radio\" name=\"intent\" value=\"buyout\" checked=\"{{ true }}\" style=\"accent-color: var(--gbb-pine);\">A · Full buyout<\u002Flabel>\n                <label style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--gbb-border); border-radius: 999px; font-size: 22px; cursor: pointer;\">\n                  <input type=\"radio\" name=\"intent\" value=\"partnership\" style=\"accent-color: var(--gbb-pine);\">B · Partnership<\u002Flabel>\n                <label style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--gbb-border); border-radius: 999px; font-size: 22px; cursor: pointer;\">\n                  <input type=\"radio\" name=\"intent\" value=\"exploring\" style=\"accent-color: var(--gbb-pine);\">Casual conversation<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"submit\" style=\"margin-top: 6px; height: 54px; border: none; border-radius: var(--radius-sm); background: var(--gbb-pine); color: #fff; font-family: inherit; font-size: 23px; font-weight: 700; cursor: pointer;\" style-hover=\"background: var(--gbb-pine-700);\">Request a meeting invite<\u002Fbutton>\n            <p style=\"margin: 0; font-size: 20px; line-height: 1.5; color: var(--gbb-muted);\">Your information will always be held in confidence.&nbsp;<\u002Fp>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 30px 0; text-align: center; display: flex; flex-direction: column; align-items: center;\">\n            <div style=\"width: 56px; height: 56px; border-radius: 50%; background: var(--gbb-amber-12); color: var(--gbb-amber); font-size: 25px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">✓<\u002Fdiv>\n            <div style=\"margin-top: 22px; font-size: 25px; font-weight: 700; letter-spacing: -0.6px; color: var(--gbb-pine);\">{{ thanks }}<\u002Fdiv>\n            <p style=\"margin: 14px 0 0; max-width: 380px; font-size: 23px; line-height: 1.6; color: var(--gbb-muted);\">That went straight to Weng Leong and Jackson. You will have a calendar invite within two working days — or pick a slot now and skip the wait.<\u002Fp>\n            <a href=\"#talk\" style=\"margin-top: 26px; display: inline-flex; align-items: center; height: 50px; padding: 0 28px; border-radius: var(--radius-sm); background: var(--gbb-amber); color: var(--gbb-pine-deep); font-size: 22px; font-weight: 700;\">Pick a time now →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: var(--gbb-pine-deep); color: #fff; border-top: 1px solid rgba(255,255,255,0.14); padding: 56px 0 40px;\">\n    <div style=\"max-width: 1080px; margin: 0 auto; padding: 0 48px; display: flex; justify-content: space-between; gap: 40px; flex-wrap: wrap; align-items: flex-start;\">\n      <div>\n        <x-import component-from-global-scope=\"GroBigBigDesignSystem_ee6236.BrandMark\" size=\"{{ 30 }}\" reversed=\"{{ true }}\" with-wordmark=\"{{ true }}\" hint-size=\"190px,32px\"><\u002Fx-import>\n        \n      <\u002Fdiv>\n      \n      \n    <\u002Fdiv>\n    <div style=\"max-width: 1080px; margin: 44px auto 0; padding: 22px 48px 0; border-top: 1px solid rgba(255,255,255,0.14); display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n      <span style=\"font-size: 21px; color: rgba(255,255,255,0.45);\">© 2026 Gro Big Big Pte. Ltd.<\u002Fspan>\n      <a href=\"#talk\" style=\"font-size: 21px; color: rgba(255,255,255,0.6);\">Talk to us →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { sent: false, name: '', stats: [3, 1500, 40, 4] };\n\n  componentDidMount() {\n    const targets = [3, 1500, 40, 4];\n    // setState's functional-updater form is not applied by this runtime, so the working\n    // values live on an instance field and every commit is a plain object.\n    this._stats = targets.slice();\n    targets.forEach((target, i) => {\n      const delay = i * 340, dur = 1240;\n      setTimeout(() => {\n        const t0 = performance.now();\n        const tick = (now) => {\n          const p = Math.min(1, (now - t0) / dur);\n          const eased = 1 - Math.pow(1 - p, 3);\n          this._stats[i] = Math.round(target * eased);\n          this.setState({ stats: this._stats.slice() });\n          if (p < 1) requestAnimationFrame(tick);\n        };\n        requestAnimationFrame(tick);\n      }, delay);\n    });\n  }\n\n  submit = (e) => {\n    e.preventDefault();\n    const data = new FormData(e.target);\n    const name = (data.get('name') || '').toString().trim();\n    this.setState({ sent: true, name: name ? name.split(' ')[0] : '' });\n  };\n\n  renderVals() {\n    const { sent, name, stats } = this.state;\n    const fmt = n => n.toLocaleString('en-US');\n    return {\n      stat0: fmt(stats[0]),\n      stat1: fmt(stats[1]),\n      stat2: fmt(stats[2]),\n      stat3: fmt(stats[3]),\n      sent,\n      notSent: !sent,\n      submit: this.submit,\n      thanks: name ? 'Thanks, ' + name + '.' : 'Thanks.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
